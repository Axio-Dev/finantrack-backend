services:
  backend:
    build: .

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      RUNNING_IN_DOCKER: "true"

    volumes:
      - .:/app

    depends_on:
      - db

  db:
    image: postgres:18

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
